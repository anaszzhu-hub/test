<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grammar Placement Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#09142e;color:#eef7ff}body{display:grid;place-items:center;overflow:hidden}#app{width:1200px;height:675px;transform-origin:center;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(62,219,255,.16),transparent 28%),radial-gradient(circle at 80% 15%,rgba(176,76,255,.14),transparent 30%),linear-gradient(135deg,#101d43,#081329 60%,#0e1939);border:1px solid rgba(120,231,255,.18)}.screen{position:absolute;inset:0;padding:42px 56px}.hidden{display:none!important}.logo{font-size:18px;letter-spacing:3px;color:#78efff;font-weight:800}h1{font-size:50px;line-height:1.05;margin:18px 0 12px}.sub{font-size:20px;line-height:1.45;color:#b7cce0;max-width:760px}.card{background:rgba(13,28,63,.86);border:1px solid rgba(120,236,255,.34);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.24)}.start-card{width:720px;padding:34px;margin-top:34px}label{display:block;font-size:17px;color:#bceeff;margin-bottom:9px;font-weight:700}input{width:100%;padding:16px 18px;border-radius:14px;border:1px solid rgba(117,230,255,.35);background:#0b1735;color:white;font-size:20px;outline:none}.btn{border:0;border-radius:14px;padding:15px 24px;font-size:18px;font-weight:800;color:white;cursor:pointer;background:linear-gradient(180deg,#29b9f3,#1569c9);box-shadow:0 5px 0 #0c4587}.btn.secondary{background:linear-gradient(180deg,#9d5df7,#6533bd);box-shadow:0 5px 0 #44217d}.start-btn{margin-top:20px;width:100%}.test-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.badge{padding:10px 16px;border-radius:999px;border:1px solid rgba(113,234,255,.35);background:#0c1c3f;font-weight:800;color:#8deeff}.progress{width:300px;height:10px;background:#14274c;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#46efff,#b35cff);transition:.25s}.q-card{padding:34px 38px;min-height:440px}.q-num{font-size:16px;color:#83eaff;font-weight:800;letter-spacing:1px}.question{font-size:34px;line-height:1.25;margin:18px 0 26px}.answers{display:grid;gap:14px}.answer{text-align:left;border:1px solid rgba(126,220,255,.24);background:#0d1e43;color:#eef7ff;border-radius:16px;padding:17px 20px;font-size:20px;cursor:pointer}.answer.selected{border-color:#9d6cff;background:#221b55}.bottom{display:flex;justify-content:flex-end;margin-top:20px}.result-wrap{display:grid;grid-template-columns:380px 1fr;gap:24px;height:100%}.summary{padding:28px}.name{font-size:18px;color:#8fefff}.level{font-size:58px;font-weight:900;margin:8px 0;color:#c4f9ff}.score{font-size:24px;margin-bottom:18px}.note{font-size:16px;line-height:1.5;color:#bfd0df}.actions{display:grid;gap:12px;margin-top:24px}.errors{padding:26px;overflow:auto}.errors h2{margin:0 0 14px;font-size:26px}.err{padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08);line-height:1.4}.err-q{font-weight:800}.yours{color:#ffb6c4;margin-top:6px}.correct{color:#95f2b7;margin-top:3px}.small{font-size:14px;color:#92a8ba}
</style></head><body><div id="app">
<section id="start" class="screen"><div class="logo">ENGLISH LEVEL CHECK</div><h1>Grammar Placement Test</h1><div class="sub">Start at A1 and unlock the next level by scoring at least 7 out of 10. Your result and mistakes will be shown at the end.</div><div class="card start-card"><label for="name">Enter your name</label><input id="name" placeholder="Your name"><button id="startBtn" class="btn start-btn">START TEST</button></div></section>
<section id="test" class="screen hidden"><div class="test-head"><div><div class="logo">GRAMMAR TEST</div><div id="stageBadge" class="badge">A1</div></div><div><div id="counter" class="small" style="text-align:right;margin-bottom:8px">1 / 10</div><div class="progress"><span id="bar"></span></div></div></div><div class="card q-card"><div id="qnum" class="q-num">QUESTION 1</div><div id="question" class="question"></div><div id="answers" class="answers"></div><div class="bottom"><button id="nextBtn" class="btn" disabled>NEXT</button></div></div></section>
<section id="result" class="screen hidden"><div class="result-wrap"><div class="card summary"><div class="logo">YOUR RESULT</div><div id="studentName" class="name"></div><div id="finalLevel" class="level">A1</div><div id="scoreSummary" class="score"></div><div id="resultText" class="note"></div><div class="actions"><button id="copyBtn" class="btn">COPY RESULTS</button><button id="downloadBtn" class="btn secondary">DOWNLOAD RESULTS</button><button id="againBtn" class="btn">TAKE TEST AGAIN</button></div></div><div class="card errors"><h2>Mistakes to review</h2><div id="errorsList"></div></div></div></section>
</div><script>
const DATA={
A1:[
{q:'My name ___ Anna.',opts:['am','is','are'],a:1},{q:'They ___ from Spain.',opts:['is','are','am'],a:1},{q:'I ___ two brothers.',opts:['have','has','having'],a:0},{q:'Tom ___ football every Saturday.',opts:['play','plays','playing'],a:1},{q:'We ___ TV now.',opts:['watch','watches','are watching'],a:2},{q:'___ you like chocolate?',opts:['Do','Does','Are'],a:0},{q:'There ___ a book on the table.',opts:['are','is','be'],a:1},{q:'I can ___ very fast.',opts:['run','runs','running'],a:0},{q:'She ___ at school yesterday.',opts:['is','was','were'],a:1},{q:'These are my ___.',opts:['friend','friends',"friend's"],a:1}],
A2:[
{q:'I ___ my homework yesterday evening.',opts:['do','did','done'],a:1},{q:'She has lived here ___ 2023.',opts:['for','since','from'],a:1},{q:"There isn't ___ milk in the fridge.",opts:['some','any','many'],a:1},{q:'My sister is ___ than me.',opts:['tall','taller','tallest'],a:1},{q:'We ___ visit Grandma next weekend.',opts:['are going to','going','go to'],a:0},{q:'Have you ever ___ to London?',opts:['be','been','went'],a:1},{q:'I was doing my homework when Mum ___.',opts:['called','was calling','calls'],a:0},{q:'You ___ eat so much chocolate.',opts:["shouldn't","don't should","shouldn't to"],a:0},{q:'This bag is ___ expensive for me.',opts:['too','enough','many'],a:0},{q:'How ___ water do you drink every day?',opts:['many','much','any'],a:1}],
B1:[
{q:'If it rains tomorrow, we ___ at home.',opts:['stay','will stay','stayed'],a:1},{q:"I've known Emma ___ five years.",opts:['since','for','during'],a:1},{q:'When I arrived, they ___ dinner.',opts:['had already finished','already finish','have already finished'],a:0},{q:'This book ___ by millions of people every year.',opts:['reads','is read','is reading'],a:1},{q:'He told me that he ___ tired.',opts:['is','was','has'],a:1},{q:"You ___ bring any food. We've got plenty.",opts:["mustn't","don't have to","shouldn't to"],a:1},{q:"That's the girl ___ won the competition.",opts:['which','who','where'],a:1},{q:"If I ___ more time, I'd learn Spanish.",opts:['have','had','will have'],a:1},{q:"I've never seen ___ interesting film.",opts:['such an','so an','such'],a:0},{q:'By the time we got to the station, the train ___.',opts:['left','had left','has left'],a:1}]};
const order=['A1','A2','B1'];let student='',stageIndex=0,qi=0,selected=null,stageScore=0,results={A1:null,A2:null,B1:null},mistakes=[];const $=id=>document.getElementById(id);function fit(){const s=Math.min(innerWidth/1200,innerHeight/675);$('app').style.transform=`scale(${s})`}addEventListener('resize',fit);fit();
$('startBtn').onclick=()=>{student=$('name').value.trim();if(!student){$('name').focus();return}$('start').classList.add('hidden');$('test').classList.remove('hidden');render()};
function render(){const level=order[stageIndex],item=DATA[level][qi];$('stageBadge').textContent=level;$('qnum').textContent=`QUESTION ${qi+1}`;$('counter').textContent=`${qi+1} / 10`;$('bar').style.width=(qi/10*100)+'%';$('question').textContent=item.q;$('answers').innerHTML='';selected=null;$('nextBtn').disabled=true;item.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+') '+o;b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=i;$('nextBtn').disabled=false};$('answers').appendChild(b)})}
$('nextBtn').onclick=()=>{const level=order[stageIndex],item=DATA[level][qi];if(selected===item.a)stageScore++;else mistakes.push({level,q:item.q,your:item.opts[selected],correct:item.opts[item.a]});qi++;if(qi<10){render();return}results[level]=stageScore;if(stageScore>=7&&stageIndex<order.length-1){stageIndex++;qi=0;stageScore=0;render()}else showResult()};
function showResult(){$('test').classList.add('hidden');$('result').classList.remove('hidden');const completed=order.filter(l=>results[l]!==null);let finalLevel='A1';if(results.B1!==null&&results.B1>=7)finalLevel='B1';else if(results.A2!==null&&results.A2>=7)finalLevel='A2';$('studentName').textContent=student;$('finalLevel').textContent=finalLevel;$('scoreSummary').innerHTML=completed.map(l=>`${l}: <b>${results[l]}/10</b>`).join('<br>');$('resultText').innerHTML=`Your approximate grammar level is <b>${finalLevel}</b>.<br><br><b>Please take a screenshot of this result and send it to your teacher.</b>`;$('errorsList').innerHTML=mistakes.length?mistakes.map((m,i)=>`<div class="err"><div class="err-q">${i+1}. [${m.level}] ${m.q}</div><div class="yours">Your answer: ${m.your}</div><div class="correct">Correct answer: ${m.correct}</div></div>`).join(''):'<div class="err correct">No mistakes — excellent work!</div>'}
function resultTextPlain(){const completed=order.filter(l=>results[l]!==null),level=$('finalLevel').textContent;let t=`Grammar Placement Test\nName: ${student}\nApproximate level: ${level}\n`;completed.forEach(l=>t+=`${l}: ${results[l]}/10\n`);t+='\nMistakes:\n';if(!mistakes.length)t+='No mistakes.\n';mistakes.forEach((m,i)=>t+=`${i+1}. [${m.level}] ${m.q}\nYour answer: ${m.your}\nCorrect answer: ${m.correct}\n\n`);t+='Please take a screenshot of this result and send it to your teacher.';return t}
$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(resultTextPlain());$('copyBtn').textContent='COPIED ✓';setTimeout(()=>$('copyBtn').textContent='COPY RESULTS',1200)};$('downloadBtn').onclick=()=>{const blob=new Blob([resultTextPlain()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`grammar-test-${student.replace(/\s+/g,'-')}.txt`;a.click();URL.revokeObjectURL(a.href)};$('againBtn').onclick=()=>location.reload();
</script></body></html>
